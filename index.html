<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다포기하지마 v0.7</title><style>
body{margin:0;background:#f4f1e8;color:#26352b;font-family:-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:20px 16px}.s{display:none}.on{display:block}.c{background:#fffdf8;border:1px solid #dfe5dc;border-radius:24px;padding:20px;margin:12px 0}.t{font-size:29px;font-weight:900;line-height:1.2}.sub{color:#718078;line-height:1.55}.sl{font-size:54px}input,button{width:100%;box-sizing:border-box;padding:15px;border-radius:16px;font:inherit;margin-top:10px}input{border:1px solid #ddd}button{border:0;background:#b9d8b5;font-weight:850}button.alt{background:#fff;border:1px solid #ddd}.m{background:#fff2b8;border-radius:18px;padding:17px;margin:15px 0}.m b{font-size:21px}.step{padding:10px 0;border-bottom:1px solid #eee}.now{font-weight:900}.bar{height:10px;background:#e5e8e2;border-radius:9px;overflow:hidden}.fill{height:100%;background:#9fc49b}.center{text-align:center}
</style></head><body><main>
<section id="start" class="s on"><div class="c"><div class="sl">🦥</div><div class="t">목표만 주세요.<br>다음 한 걸음은 제가 정할게요.</div><p class="sub">전체 계획을 고민하지 않아도 됩니다.</p><input id="g" placeholder="예: 앱을 App Store에 출시하기"><button onclick="create()">목표 시작하기</button></div></section>
<section id="home" class="s"><div class="c"><small>🎯 목표</small><div class="t" id="gt" style="font-size:23px"></div><div class="bar"><div id="fill" class="fill" style="width:10%"></div></div><p class="sub" id="pos">목표를 시작했어요.</p><div id="road"></div></div><div class="c"><small>👣 지금 할 일 · 약 3분</small><div class="m"><b id="mt"></b><p class="sub" id="mh"></p></div><button onclick="done()">했어요</button><button class="alt" onclick="stuck()">🆘 막혔어</button></div></section>
<section id="rescue" class="s"><div class="c"><div class="sl">🦥</div><div class="t">막힌 채로 끝내지 않을게요.</div><p class="sub">행동을 더 작게 바꿨어요.</p><div class="m"><b id="rt"></b></div><button onclick="done()">이것은 할 수 있어</button></div></section>
<section id="complete" class="s"><div class="c center"><div class="sl">🦥→</div><div class="t">한 걸음 전진했어요.</div><p class="sub">오늘 이것 하나는 했어요.</p><button onclick="next()">다음 행동 확인</button><button class="alt" onclick="finish()">오늘은 여기까지</button></div></section>
<section id="end" class="s"><div class="c center"><div class="sl">🦥</div><div class="t">오늘 완료.</div><p class="sub" id="summary"></p><button onclick="next()">현재 프로젝트 보기</button></div></section>
</main><script>
const K='d07',M=[
['끝났다고 판단할 수 있는 기준을 한 문장으로 정하기','무엇이 되면 이 목표가 끝인지 정하세요.','목표 문장을 한 번 읽기'],
['목표까지 필요한 가장 큰 단계 3개 떠올리기','시작·중간·완료 정도면 충분해요.','첫 단계 하나만 떠올리기'],
['첫 단계에서 3분 안에 할 수 있는 행동 하나 실행하기','아주 작아도 실제 행동이어야 합니다.','30초짜리 행동으로 줄이기'],
['방금 한 행동으로 무엇이 달라졌는지 확인하기','한 문장으로만 확인하세요.','완료한 행동 이름만 보기'],
['다음에 막힐 가능성이 큰 지점 하나 확인하기','해결하지 말고 위치만 알아차리세요.','막힐 지점 하나만 떠올리기']];
function S(x){document.querySelectorAll('.s').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on')}
function load(){return JSON.parse(localStorage.getItem(K)||'null')}function save(x){localStorage.setItem(K,JSON.stringify(x))}
function create(){let g=document.getElementById('g').value.trim();if(!g)return alert('목표를 한 문장만 적어주세요.');let x={g:g,i:0,n:0};save(x);render(x);S('home')}
function render(x){gt.textContent=x.g;let p=10+x.n*15;fill.style.width=p+'%';pos.textContent=x.n?'오늘 '+x.n+'걸음 전진':'목표를 시작했어요.';let L=['목표 고정','길 나누기','첫 행동','결과 확인','막힘 대비'];road.innerHTML=L.map((v,j)=>'<div class="step '+(j==x.i?'now':'')+'">'+(j<x.i?'✓ ':'')+v+(j==x.i?' ← 지금 여기':'')+'</div>').join('');mt.textContent=M[x.i][0];mh.textContent=M[x.i][1];rt.textContent=M[x.i][2]}
function done(){let x=load();x.n++;x.i=Math.min(x.i+1,M.length-1);save(x);S('complete')}function stuck(){S('rescue')}function next(){let x=load();render(x);S('home')}function finish(){let x=load();summary.textContent='“'+x.g+'”에서 오늘 '+x.n+'개의 행동을 완료했습니다.';S('end')}
let x=load();if(x){render(x);S('home')}
</script></body></html>
